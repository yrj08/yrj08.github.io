<h1>Trip ID Viewer</h1>

    69 following trips.

<script>

    // ============================================================
    // Configuration
    // ============================================================

    const DATA_FILE = "trips.txt";

    const PREVIOUS_TRIPS = 30;
    const FOLLOWING_TRIPS = 69;


    // ============================================================
    // Global trip data
    // ============================================================

    let trips = [];


    // ============================================================
    // Automatically load trips.txt
    // ============================================================

    async function loadDefaultFile() {

        try {

            const response = await fetch(DATA_FILE);

            if (!response.ok) {
                throw new Error(
                    "Could not load " + DATA_FILE
                );
            }

            const text = await response.text();

            loadTripData(text);

            setStatus(
                "Loaded " +
                trips.length.toLocaleString() +
                " trips from " +
                DATA_FILE,
                "success"
            );

        } catch (error) {

            setStatus(
                "Could not automatically load " +
                DATA_FILE +
                ". If you opened this HTML directly, " +
                "select the TXT file below.",
                "error"
            );
        }
    }


    // ============================================================
    // File picker
    // ============================================================

    document
        .getElementById("fileInput")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                try {

                    loadTripData(e.target.result);

                    setStatus(
                        "Loaded " +
                        trips.length.toLocaleString() +
                        " trips from " +
                        file.name,
                        "success"
                    );

                } catch (error) {

                    trips = [];

                    setStatus(
                        "Error reading file: " +
                        error.message,
                        "error"
                    );
                }
            };

            reader.onerror = function() {

                setStatus(
                    "Could not read the selected file.",
                    "error"
                );
            };

            reader.readAsText(file);
        });


    // ============================================================
    // Load and parse trip data
    // ============================================================

    function loadTripData(text) {

        // Remove UTF-8 BOM if present.
        text = text.replace(/^\uFEFF/, "");

        const lines = text
            .split(/\r?\n/)
            .filter(line => line.trim() !== "");

        if (lines.length < 2) {

            trips = [];

            throw new Error(
                "The file does not contain any trip records."
            );
        }


        // --------------------------------------------------------
        // Read header
        // --------------------------------------------------------

        const headers = parseCSVLine(lines[0]);

        const columnIndex = {};

        headers.forEach((header, index) => {

            columnIndex[header.trim()] = index;

        });


        // --------------------------------------------------------
        // Required columns
        // --------------------------------------------------------

        const requiredColumns = [
            "route_id",
            "service_id",
            "trip_id",
            "trip_headsign",
            "direction_id",
            "shape_id",
            "wheelchair_accessible",
            "route_pattern_id",
            "start_time",
            "end_time"
        ];


        for (const column of requiredColumns) {

            if (!(column in columnIndex)) {

                throw new Error(
                    'Required column "' +
                    column +
                    '" was not found.'
                );
            }
        }


        // --------------------------------------------------------
        // Read records
        // --------------------------------------------------------

        trips = [];

        for (let i = 1; i < lines.length; i++) {

            const fields = parseCSVLine(lines[i]);

            if (fields.length === 0) {
                continue;
            }


            const trip = {

                route_id:
                    getField(
                        fields,
                        columnIndex,
                        "route_id"
                    ),

                service_id:
                    getField(
                        fields,
                        columnIndex,
                        "service_id"
                    ),

                trip_id:
                    getField(
                        fields,
                        columnIndex,
                        "trip_id"
                    ),

                trip_headsign:
                    getField(
                        fields,
                        columnIndex,
                        "trip_headsign"
                    ),

                direction_id:
                    getField(
                        fields,
                        columnIndex,
                        "direction_id"
                    ),

                shape_id:
                    getField(
                        fields,
                        columnIndex,
                        "shape_id"
                    ),

                wheelchair_accessible:
                    getField(
                        fields,
                        columnIndex,
                        "wheelchair_accessible"
                    ),

                route_pattern_id:
                    getField(
                        fields,
                        columnIndex,
                        "route_pattern_id"
                    ),

                start_time:
                    getField(
                        fields,
                        columnIndex,
                        "start_time"
                    ),

                end_time:
                    getField(
                        fields,
                        columnIndex,
                        "end_time"
                    )
            };


            // Ignore rows without a trip ID.
            if (trip.trip_id === "") {
                continue;
            }


            trips.push(trip);
        }


        // --------------------------------------------------------
        // Sort trips
        // --------------------------------------------------------

        trips.sort(compareTripIDs);
    }


    // ============================================================
    // CSV parser
    //
    // Handles:
    //   normal fields
    //   quoted fields
    //   commas inside quoted fields
    //   escaped quotes ("")
    // ============================================================

    function parseCSVLine(line) {

        const result = [];

        let current = "";

        let insideQuotes = false;


        for (let i = 0; i < line.length; i++) {

            const character = line[i];


            if (character === '"') {

                // Escaped quote inside quoted field.
                if (
                    insideQuotes &&
                    line[i + 1] === '"'
                ) {

                    current += '"';

                    i++;

                } else {

                    insideQuotes = !insideQuotes;
                }


            } else if (
                character === "," &&
                !insideQuotes
            ) {

                result.push(current);

                current = "";


            } else {

                current += character;
            }
        }


        result.push(current);

        return result;
    }


    // ============================================================
    // Get a field by column name
    // ============================================================

    function getField(
        fields,
        columnIndex,
        columnName
    ) {

        const index = columnIndex[columnName];


        if (
            index === undefined ||
            index >= fields.length
        ) {

            return "";
        }


        return fields[index].trim();
    }


    // ============================================================
    // Determine whether a trip ID is numerical
    //
    // Entire ID must consist of digits.
    //
    // Examples:
    //
    // 301711659        -> numerical
    // 123456789        -> numerical
    // 26S_196_19_0530 -> non-numerical
    // 301ABC           -> non-numerical
    // ============================================================

    function isNumericalTripID(id) {

        return /^\d+$/.test(id);
    }


    // ============================================================
    // Compare trip IDs
    //
    // Numerical IDs come first and are sorted numerically.
    //
    // Non-numerical IDs come afterward and are sorted
    // alphabetically/naturally.
    // ============================================================

    function compareTripIDs(a, b) {

        const aID = a.trip_id;

        const bID = b.trip_id;


        const aNumerical =
            isNumericalTripID(aID);

        const bNumerical =
            isNumericalTripID(bID);


        // --------------------------------------------------------
        // Numerical IDs before non-numerical IDs
        // --------------------------------------------------------

        if (
            aNumerical &&
            !bNumerical
        ) {

            return -1;
        }


        if (
            !aNumerical &&
            bNumerical
        ) {

            return 1;
        }


        // --------------------------------------------------------
        // Both numerical
        //
        // BigInt avoids JavaScript's Number precision limitations
        // for very large numeric IDs.
        // --------------------------------------------------------

        if (
            aNumerical &&
            bNumerical
        ) {

            const aNumber = BigInt(aID);

            const bNumber = BigInt(bID);


            if (aNumber < bNumber) {
                return -1;
            }


            if (aNumber > bNumber) {
                return 1;
            }


            return 0;
        }


        // --------------------------------------------------------
        // Both non-numerical
        // --------------------------------------------------------

        return aID.localeCompare(
            bID,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        );
    }


    // ============================================================
    // Format time
    //
    // Seconds are discarded.
    //
    // 05:05:00 -> 05:05
    // 05:05:59 -> 05:05
    //
    // Importantly, 25-hour GTFS-style times are preserved:
    //
    // 25:11:00 -> 25:11
    //
    // We do NOT convert 25:xx into 01:xx.
    // ============================================================

    function formatTime(time) {

        if (!time) {
            return "";
        }


        const parts = time
            .trim()
            .split(":");


        if (parts.length < 2) {
            return time;
        }


        return (
            parts[0].padStart(2, "0") +
            ":" +
            parts[1].padStart(2, "0")
        );
    }


    // ============================================================
    // Format accessibility
    //
    // 0 -> ––
    // 1 -> ♿
    // 2 -> ––
    // ============================================================

    function formatAccessibility(value) {

        value = String(value).trim();


        if (value === "1") {
            return "♿";
        }


        return "––";
    }


    // ============================================================
    // Search for trip
    // ============================================================

    function searchTrip() {

        const input =
            document
                .getElementById("tripInput")
                .value
                .trim();


        const tableContainer =
            document.getElementById(
                "tableContainer"
            );


        // --------------------------------------------------------
        // No input
        // --------------------------------------------------------

        if (!input) {

            setStatus(
                "Please enter a trip ID.",
                "error"
            );

            tableContainer.innerHTML = "";

            return;
        }


        // --------------------------------------------------------
        // No data
        // --------------------------------------------------------

        if (trips.length === 0) {

            setStatus(
                "No trip data is loaded.",
                "error"
            );

            tableContainer.innerHTML = "";

            return;
        }


        // --------------------------------------------------------
        // Find exact trip ID
        // --------------------------------------------------------

        const currentIndex =
            trips.findIndex(
                trip => trip.trip_id === input
            );


        // --------------------------------------------------------
        // Trip does not exist
        // --------------------------------------------------------

        if (currentIndex === -1) {

            setStatus(
                "Trip ID " +
                escapeHTML(input) +
                " does not exist.",
                "error"
            );

            tableContainer.innerHTML = "";

            return;
        }


        // --------------------------------------------------------
        // Determine display range
        //
        // 30 before
        // current trip
        // 69 after
        //
        // = 100 trips total
        //
        // Near the beginning/end of the dataset, the available
        // trips are displayed instead.
        // --------------------------------------------------------

        const startIndex =
            Math.max(
                0,
                currentIndex - PREVIOUS_TRIPS
            );


        const endIndex =
            Math.min(
                trips.length,
                currentIndex +
                FOLLOWING_TRIPS +
                1
            );


        const displayedTrips =
            trips.slice(
                startIndex,
                endIndex
            );


        // --------------------------------------------------------
        // Status
        // --------------------------------------------------------

        setStatus(
            "Showing trips " +
            (startIndex + 1).toLocaleString() +
            "–" +
            endIndex.toLocaleString() +
            " of " +
            trips.length.toLocaleString(),
            "success"
        );


        // --------------------------------------------------------
        // Build table
        // --------------------------------------------------------

        let html = `

            <table>

                <thead>

                    <tr>
                        <th>Trip ID</th>
                        <th>Service ID</th>
                        <th>Route</th>
                        <th>Headsign</th>
                        <th>Accessibility</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                    </tr>

                </thead>

                <tbody>

        `;


        displayedTrips.forEach(trip => {

            const isCurrent =
                trip.trip_id === input;


            html += `

                <tr class="${
                    isCurrent
                        ? "current-trip"
                        : ""
                }">

                    <td class="trip-id">
                        <strong>
                            ${escapeHTML(trip.trip_id)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(trip.service_id)}
                    </td>

                    <td>
                        ${escapeHTML(trip.route_id)}
                    </td>

                    <td>
                        ${escapeHTML(trip.trip_headsign)}
                    </td>

                    <td class="accessibility">
                        ${formatAccessibility(
                            trip.wheelchair_accessible
                        )}
                    </td>

                    <td class="time">
                        ${escapeHTML(
                            formatTime(trip.start_time)
                        )}
                    </td>

                    <td class="time">
                        ${escapeHTML(
                            formatTime(trip.end_time)
                        )}
                    </td>

                </tr>

            `;
        });


        html += `

                </tbody>

            </table>

        `;


        tableContainer.innerHTML = html;
    }


    // ============================================================
    // Escape HTML
    //
    // Prevents text from the TXT file from being interpreted
    // as HTML.
    // ============================================================

    function escapeHTML(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");
    }


    // ============================================================
    // Set status message
    // ============================================================

    function setStatus(
        message,
        type
    ) {

        const status =
            document.getElementById("status");


        status.innerHTML = message;


        status.className =
            "status " + (type || "");
    }


    // ============================================================
    // Search button
    // ============================================================

    document
        .getElementById("searchButton")
        .addEventListener(
            "click",
            searchTrip
        );


    // ============================================================
    // Enter key in Trip ID field
    // ============================================================

    document
        .getElementById("tripInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    searchTrip();
                }

            }
        );


    // ============================================================
    // Automatically load trips.txt when the page opens
    // ============================================================

    loadDefaultFile();

</script>

</body>
</html>
