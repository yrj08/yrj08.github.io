<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ligne 460</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

<style>
* {box-sizing: border-box;}

.column {
  float: left;
  width: 50%;
  padding: 10px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .column {
    width: 100%;
  }
}
#map { height: 100vh; }
</style>
</head>
<body>

<div id="controls"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="GeoJSON/routeMap.js"></script>

<script>
createRouteMap({
  mapId: "map",

  center: [45.55, -73.7],
  zoom: 12,

  // Your files
  currentShapes: "GeoJSON/curr-121.geojson",
  newShapes: "GeoJSON/121.geojson",

  currentStops: "GeoJSON/oldstops.geojson",
  newStops: "GeoJSON/oldstops.geojson",

  // Manual overrides by branch ID
branchStyles: {
    "1219001": {
      line: {
        color: "#781B7D",
        weight: 4,
        opacity: 1
      },
      stop: {
        radius: 4,
        weight: 3,
        color: "#781B7D",
        fillOpacity: 1,
        shape: "circle"
      }
    },

    "1210002": {
      line: {
        color: "#8B469E",
        weight: 4,
        opacity: 0.8
      },
      stop: {
        radius: 4,
        weight: 3,
        color: "#8B469E",
        shape: "circle",
        fillOpacity: 1
      }
    },

    "current": {
      line: {
        color: "#FFC68F",
        weight: 9,
        opacity: 1
      },
      stop: {
        radius: 4,
        weight: 4,
        color: "#FFC68F",
        shape: "circle",
        fillOpacity: 1
      }
    }
  },
  
  checkboxContainerId: "controls"
});
</script>

</body>
</html>
