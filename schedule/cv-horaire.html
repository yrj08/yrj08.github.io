<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transit Timetable Generator</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 12px;
      background: #f7f7f7;
      font-size: 13px;
    }

    h1, h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 3px 5px;
      text-align: left;
      vertical-align: top;
      line-height: 1.2;
    }

    th {
      background: #eaeaea;
    }

     .hour-cell {
      width: 42px;
      font-weight: bold;
      background: #f2f2f2;
      white-space: nowrap;
    }

    .minute {
      display: inline-block;
      padding: 2px 5px;
      margin: 1px;
      border-radius: 3px;
      color: white;
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .grid-selector {
      display: grid;
      grid-template-columns: 90px repeat(3, 100px);
      gap: 4px;
      align-items: center;
    }

    .selector-btn, .route-btn {
      padding: 6px;
      border: 1px solid #999;
      background: white;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
    }

    .active {
      background: #d9d9d9 !important;
      color: black !important;
    }

    .inactive-route {
      opacity: 0.35;
      filter: grayscale(60%);
    }

    .upload-section {
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Transit Timetable Generator</h1>

  <div class="controls">
    <div>
      <strong>Select route:</strong>
      <div id="routeFilters"></div>
    </div>

    <div class="grid-selector" id="fileSelector">
      <div></div><div>Weekday</div><div>Saturday</div><div>Sunday</div>
      <div>Westbound</div>
      <button class="selector-btn" data-file="weekday_west.csv">Weekday</button>
      <button class="selector-btn" data-file="saturday_west.csv">Saturday</button>
      <button class="selector-btn" data-file="sunday_west.csv">Sunday</button>
      <div>Eastbound</div>
      <button class="selector-btn" data-file="weekday_east.csv">Weekday</button>
      <button class="selector-btn" data-file="saturday_east.csv">Saturday</button>
      <button class="selector-btn" data-file="sunday_east.csv">Sunday</button>
    </div>
  </div>

  <div id="output"></div>

  <script>
    const ROUTE_COLORS = {
      '121': '#FFFBE4',
      '171': '#CEFFC9',
      '174': '#FFDDA4',
      '177': '#C9F0FF',
      '378': '#FFD2D2',
      '380': '#EFC4FF'
    };

    let selectedRoutes = new Set();

    init();

    async function init() {
      const files = [
        'weekday_west.csv',
        'weekday_east.csv',
        'saturday_west.csv',
        'saturday_east.csv',
        'sunday_west.csv',
        'sunday_east.csv'
      ];

      let allRows = [];
      for (const file of files) {
        try {
          const rows = await loadCSV(file);
          allRows = allRows.concat(rows);
        } catch (err) {
          console.error(`Could not load ${file}`, err);
        }
      }

      const routes = [...new Set(allRows.map(r => r.route))]
        .sort((a, b) => Number(a) - Number(b));

      renderRouteFilters(routes);

      document.querySelectorAll('.selector-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderFile(btn.dataset.file);
        });
      });
      });

      // no default file selected on load
    }

    async function renderFile(fileName) {
      const output = document.getElementById('output');
      output.innerHTML = '';

      const rows = await loadCSV(fileName);
      const filtered = selectedRoutes.size
        ? rows.filter(r => selectedRoutes.has(r.route))
        : rows;

      const grouped = groupByHour(filtered);
      const section = document.createElement('div');
      section.innerHTML = `<h2>${fileName}</h2>`;
      section.appendChild(buildTable(grouped));
      output.appendChild(section);
    }

    async function loadCSV(fileName) {
      const response = await fetch(fileName);
      const text = await response.text();
      return parseCSV(text);
    }

    function renderRouteFilters(routes) {
      const container = document.getElementById('routeFilters');
      container.innerHTML = '';

      routes.forEach(route => {
        const btn = document.createElement('button');
        btn.className = 'route-btn active';
        btn.textContent = route;
        btn.style.backgroundColor = ROUTE_COLORS[route] || '#eee';
        btn.style.color = 'black';
        btn.style.fontWeight = 'bold';

        selectedRoutes.add(route);

        btn.addEventListener('click', () => {
          if (selectedRoutes.has(route)) {
            selectedRoutes.delete(route);
            btn.classList.remove('active');
            btn.classList.add('inactive-route');
          } else {
            selectedRoutes.add(route);
            btn.classList.add('active');
            btn.classList.remove('inactive-route');
          }

          const activeBtn = document.querySelector('.selector-btn.active');
          if (activeBtn) {
            renderFile(activeBtn.dataset.file);
          }
        });

        container.appendChild(btn);
      });
    }

    function parseCSV(text) {
      return text.trim().split(/\r?\n/).map(line => {
        const [route, time] = line.split(',');
        return { route: route.trim(), time: time.trim() };
      });
    }

    function groupByHour(rows) {
      const grouped = {};

      rows.forEach(({ route, time }) => {
        const [hour, minute] = time.split(':');
        if (!grouped[hour]) grouped[hour] = [];
        grouped[hour].push({ route, minute });
      });

      return grouped;
    }

    

    function buildTable(grouped) {
      const table = document.createElement('table');
      table.innerHTML = '<tr><th>Hour</th><th>Departures</th></tr>';

      Object.keys(grouped).sort().forEach(hour => {
        const tr = document.createElement('tr');
        const hourTd = document.createElement('td');
        hourTd.className = 'hour-cell';
        hourTd.textContent = `${hour}h`;
        tr.appendChild(hourTd);

        const depTd = document.createElement('td');
        depTd.style.maxWidth = '900px';
        depTd.style.wordBreak = 'break-word';

        grouped[hour].forEach(dep => {
          const span = document.createElement('span');
          span.className = 'minute';
          span.textContent = dep.minute;
          span.style.backgroundColor = ROUTE_COLORS[dep.route] || '#eee';
          span.style.color = 'black';
          depTd.appendChild(span);
        });

        tr.appendChild(depTd);
        table.appendChild(tr);
      });

      return table;
    }
  </script>
</body>
</html>
