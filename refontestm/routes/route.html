<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligne 16</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
* {box-sizing: border-box;}

.column {
  float: left;
  width: 50%;
  padding: 10px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .column {
    width: 100%;
  }
}

table.dataframe {
  border-collapse: collapse;
  width: 100%;
}

table.dataframe th,
table.dataframe td {
  border: 1px solid black;
  padding: 4px;
}

table.dataframe th {
  background-color: #f0f0f0;
}
  
#map { height: 100vh; }
</style>
</head>

<body>

<h1 id="title"></h1>

<div id="controls"></div>
<div id="map"></div>

<h2>Liste d'arrêts desservis</h2>
<div class="row">
  <div class="column">
    <h3 id="title-left"></h3>
    <div id="table-left"></div>
  </div>
  <div class="column">
    <h3 id="title-right"></h3>
    <div id="table-right"></div>
  </div>
</div>

<h2>Modifications proposées</h2>
<ul id="changements"></ul>

<h2>Raisonnement</h2>
<ul id="pourquoi"></ul>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="../GeoJSON/routeConfig.js"></script>
<script src="../GeoJSON/routeMap.js"></script>
<script src="../GeoJSON/stopTable.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const routeId = params.get("route");

  if (!routeId) {
    document.body.innerHTML = "<h2>No route specified</h2>";
    return;
  }

  const cfg = routeConfigs[routeId];

  if (!cfg) {
    document.body.innerHTML = `<h2>Route ${routeId} not found</h2>`;
    return;
  }

  document.title = cfg.title;

  document.getElementById("title").innerText = cfg.title;
  document.getElementById("changements").innerHTML = cfg.changements;
  document.getElementById("pourquoi").innerHTML = cfg.pourquoi;

  createRouteMap({
    mapId: "map",
    ...cfg.files,
    branchStyles: cfg.branchStyles,
    directionLabels: cfg.directionLabels
  });
});
</script>
  
</body>
</html>
